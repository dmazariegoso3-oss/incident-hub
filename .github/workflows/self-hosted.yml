name: Self-hosted validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-validation:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Validate local agent
        run: python -m unittest discover -s tests -v
      - name: Package
        run: python devops/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: self-hosted-incident-hub
          path: dist/*.zip
